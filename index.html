function finishDraw(){clearTimers();if(!pending)return;const {i,e,mode}=pending;pending=null;$('reveal').className='reveal';const d=gods[i];$('mode').textContent=mode;$('name').textContent=d.name;$('catch').textContent=d.catch||'';$('emotion').textContent='今日の気持ち：'+e;$('fortune').textContent=d.fortunes[e];$('tip').textContent='🌱 今日の小さなお告げ：'+d.tip;const art=$('art');art.replaceChildren();const img=document.createElement('img');img.src=imageByName[d.name];img.alt=d.name+'のイラスト';img.onerror=()=>{const err=document.createElement('p');err.className='missing';err.textContent='画像が見つからへん：'+imageByName[d.name];art.replaceChildren(err)};art.appendChild(img);$('shrine').classList.add('hidden');$('buttons').classList.add('hidden');$('hint').hidden=true;$('result').classList.add('visible');window.scrollTo({top:0,behavior:'smooth'})}

</script></body></html>
