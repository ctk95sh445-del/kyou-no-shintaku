x;line-height:1.7;color:#8b7869;margin:13px 0}.reveal{position:fixed;inset:0;z-index:20;background:radial-gradient(circle,#fdf5df,#d7b887 75%,#9c7759);display:none;align-items:center;justify-content:center;flex-direction:column;overflow:hidden}.reveal.active{display:flex}.reveal .rays{position:absolute;width:120vmax;height:120vmax;border-radius:50%;background:repeating-conic-gradient(from 0deg,#fff8de88 0deg 9deg,transparent 9deg 22deg);animation:spin 18s linear infinite;opacity:.55}.glow{position:absolute;width:290px;height:290px;border-radius:50%;background:radial-gradient(circle,#fffdf0 0,#ffe8a9 35%,#fff0a400 70%);animation:pulse 1.5s ease-in-out infinite}.paper{position:absolute;width:60px;height:205px;top:50%;left:50%;margin-left:-30px;margin-top:-90px;background:linear-gradient(90deg,#f5e5c6,#fffdf2 40%,#f4e5ca);border:2px solid #c49b6e;box-shadow:0 5px 24px #765c3b77;writing-mode:vertical-rl;display:grid;place-items:center;font-family:serif;font-size:24px;letter-spacing:.25em;color:#9e6645;opacity:0;transform:translateY(130px) scale(.65)}.reveal.phase1 .paper{animation:paperRise 1.1s ease-out forwards}.reveal.phase2 .paper{opacity:1;transform:translateY(-35px) rotate(-8deg);filter:drop-shadow(0 0 24px #fff9b7)}.silhouette{position:absolute;width:min(70vw,290px);height:min(70vw,290px);object-fit:contain;border-radius:24px;opacity:0;filter:brightness(0) drop-shadow(0 0 17px #fff4bc);transform:scale(.55)}.reveal.phase3 .silhouette{animation:shadowIn 1.05s ease-out forwards}.reveal.phase4 .silhouette{opacity:1;filter:brightness(1);transform:scale(1);transition:filter .6s,transform .6s}.flash{position:absolute;inset:0;background:#fffdf1;opacity:0;pointer-events:none}.reveal.phase4 .flash{animation:flash .9s ease-out forwards}.reveal-text{position:absolute;bottom:13%;font-size:18px;font-family:serif;letter-spacing:.14em;color:#6d4e36;text-shadow:0 2px #fff6e3}.skip{position:absolute;top:24px;right:22px;border:1px solid #9d7e5f;background:#fffaeeaa;color:#604a39;padding:8px 16px;border-radius:25px;z-index:3}.result{display:none;margin:18px 0 0;background:#fffdf8;border:2px solid #e6d9c6;border-radius:22px;padding:20px 17px;box-shadow:0 7px 22px #8a6c4211}.result.visible{display:block;animation:fadeUp .6s ease-out}.result img{display:block;width:min(100%,340px);margin:auto;border-radius:14px}.mode{font-size:12px;color:#8c725b;margin:8px}.godname{font-size:26px;font-weight:800;margin:8px 0}.catch{color:#997350}.emotion{display:inline-block;background:#f4e8d3;padding:5px 18px;border-radius:30px;margin:8px}.fortune{font-size:16px;line-height:2;text-align:left;padding:15px 3px}.tip{text-align:left;background:#f4f0e5;padding:15px;border-radius:12px;line-height:1.8}.back{margin-top:15px;background:none;border:1px solid #aa927e;border-radius:25px;padding:10px 20px;color:#6b5543}.missing{font-size:13px;color:#a56c55}.shrine.hidden,.buttons.hidden{display:none}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.23);opacity:.6}}@keyframes paperRise{to{opacity:1;transform:translateY(-35px) rotate(-8deg)}}@keyframes shadowIn{to{opacity:1;transform:scale(1)}}@keyframes flash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* 新しい神社イラストと光の演出 */
.shrine .shrine-background{display:block;width:100%;height:100%;object-fit:cover;object-position:center center}
.shrine:after{background:linear-gradient(0deg,#fff6e2a8 0%,transparent 28%,#fff9e52a 100%)}
.scene-title{top:5%;color:#6c4935;font-weight:800;text-shadow:0 2px 4px #fff9ec,0 0 10px white}
.omikuji-box{bottom:5%;transform:translateX(-50%) scale(.92)}
.reveal{background:radial-gradient(circle,#fff7d7 0%,#f5cf84 46%,#9a6b5a 100%)}
.reveal .rays{opacity:.9;animation:spin 9s linear infinite;background:repeating-conic-gradient(from 0deg,#fff8cf 0deg 7deg,#ffeb7b44 7deg 12deg,transparent 12deg 22deg)}
.glow{width:370px;height:370px;background:radial-gradient(circle,#fff 0%,#fff9cc 23%,#ffe86ab8 47%,transparent 75%);filter:blur(6px);animation:pulse .85s ease-in-out infinite}
.silhouette{position:absolute;width:min(76vw,315px);height:min(80vw,340px);overflow:visible;opacity:0;filter:drop-shadow(0 0 16px #fff) drop-shadow(0 0 34px #fff18a);transform:scale(.5);z-index:2}
.reveal.phase3 .silhouette{animation:shadowIn .85s ease-out forwards}
.reveal.phase4 .silhouette{opacity:0;transform:scale(1.5);transition:opacity .35s,transform .5s}
.appear-god{position:absolute;width:min(76vw,310px);height:min(76vw,310px);object-fit:contain;z-index:2;opacity:0;transform:scale(.72);border-radius:18px;filter:drop-shadow(0 0 22px #fff6bd)}

.flash{z-index:4;background:radial-gradient(circle,#fff 0%,#fff 35%,#fff7c5 62%,#fff6d900 100%)}
.reveal.phase4 .flash{animation:superflash 1.25s ease-out forwards}
@keyframes superflash{0%{opacity:0;transform:scale(.3)}16%{opacity:1;transform:scale(1.6)}42%{opacity:.96;transform:scale(2.2)}100%{opacity:0;transform:scale(2.8)}}
.reveal-text{z-index:5;text-shadow:0 0 9px white,0 2px white}

.lucky-value{font-size:15px;font-weight:700;line-height:1.55;overflow-wrap:anywhere}

/* 手描きのおみくじ風：日本語手書き書体と段違いの幸運札 */

body,button,.title,.paper,.reveal-text,.omikuji-box span{font-family:'Klee One','Hiragino Maru Gothic ProN','Yu Mincho',serif}
body{color:var(--pencil)}
.title{font-weight:600;letter-spacing:.09em}

.lucky-title{font-weight:600;font-size:20px;letter-spacing:.08em;margin:23px 0 17px}
.lucky-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:14px;row-gap:12px;align-items:start;padding:0 3px 15px}
.lucky-cell{position:relative;background:#fff8e9;border:1.5px solid #d7bd96;border-radius:7px 15px 9px 14px;padding:14px 10px 15px;min-height:94px;box-shadow:2px 4px 0 #e8d8bd80,0 4px 10px #94704a12;transform:rotate(-1.4deg)}

.omikuji-box{appearance:none;cursor:pointer;bottom:19%;width:118px;height:102px;left:50%;z-index:5;transform:translateX(-50%);transition:filter .18s,transform .18s;touch-action:manipulation;animation:boxBreath 2.7s ease-in-out infinite}

.omikuji-box span{font-family:'Klee One','Yu Mincho',serif;font-size:15px;font-weight:600;writing-mode:vertical-rl;width:49px;margin:21px auto 0;padding:6px 3px}
.box-prompt{position:absolute;bottom:5%;left:4%;right:4%;z-index:5;padding:8px 12px;border-radius:25px;background:#fff9e9df;color:#61472d;font-size:14px;font-weight:600;box-shadow:0 3px 12px #5d472633;pointer-events:none}
.buttons{margin-top:15px}
@keyframes boxBreath{0%,100%{filter:drop-shadow(0 0 3px #ffedac88)}50%{filter:drop-shadow(0 0 16px #ffeb9a) brightness(1.08)}}

.omikuji-box,.omikuji-box:before,.omikuji-box:after{background:none!important;border:0!important;box-shadow:none!important;border-radius:0!important}
.omikuji-box:before,.omikuji-box:after{content:none!important}

.omikuji-box:active{transform:translateX(-50%) scale(.94)!important}
@keyframes tubeBreath{50%{filter:drop-shadow(0 0 14px #fff3a9) drop-shadow(0 8px 7px #36271970)}}

/* 絵馬の幸運札：左右独立した、少し不揃いな吊り下げ配置 */
.lucky-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:13px;align-items:start;padding:8px 3px 20px;overflow:visible}

body{background:repeating-linear-gradient(93deg,#e4cfac 0,#e9d8ba 24px,#d9c29e 27px,#e9d7b6 53px,#dbc39d 57px,#e7d3b0 83px);background-attachment:fixed}
